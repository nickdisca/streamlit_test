name: Wake Streamlit Analytics App Up with Button

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  wake_up_sa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Selenium script
        run: python wake_up_streamlit_analytics.py